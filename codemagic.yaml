workflows:
  ios-workflow:
    name: iOS Workflow
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Paketleri yükle
        script: |
          flutter pub get
      - name: CocoaPods bağımlılıklarını kur
        script: |
          cd ios && pod install
      - name: iOS için arşiv oluştur
        script: |
          flutter build ipa --release --no-codesign